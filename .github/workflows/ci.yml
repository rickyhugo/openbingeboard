name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v5
        with:
          install: true

      - run: pnpm install --frozen-lockfile

      - run: hk check --all

      - run: pnpm build
